<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bienvenido a CSRA</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2d2d2d;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 80%;
            max-width: 400px;
        }
        h1 { color: #00ff00; }
        .field { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; }
        input, select {
            width: 100%;
            padding: 0.5rem;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #333;
            color: white;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #008800;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover { background-color: #00aa00; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CSRA Login</h1>
        <div class="field">
            <label for="username">Nombre de Usuario:</label>
            <input type="text" id="username" placeholder="Escribe tu nombre">
        </div>
        <div class="field">
            <label for="disability">Tipo de Discapacidad:</label>
            <select id="disability">
                <option value="sin_vision">Sin Visión (Braille y Voz)</option>
                <option value="baja_vision">Baja Visión (Ampliación y Contraste)</option>
            </select>
        </div>
        <div class="field">
            <label for="profile">Perfil de Usuario:</label>
            <select id="profile">
                <option value="usuario">Usuario Estándar</option>
                <option value="profesional">Profesional de Audio</option>
                <option value="desarrollador">Desarrollador</option>
            </select>
        </div>
        <div class="field">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="Tu clave de seguridad">
        </div>
        <button onclick="login()">Iniciar Sesión</button>
    </div>

    <script>
        function login() {
            const user = document.getElementById('username').value;
            const disability = document.getElementById('disability').value;
            const profile = document.getElementById('profile').value;
            
            // En una integración real, aquí se enviarían los datos al motor CSRA-L
            alert('Configuración guardada para ' + user);
            // El motor cerrará la ventana tras recibir los datos
        }
    </script>
</body>
</html>
