summary = "Extensão de comandos globais do NVDA"
description = """Este complemento traz ao NVDA uma infinidade de recursos que podem ser ativados ou desativados individualmente dependendo da necessidade.
Aqui estão alguns:
* Exibição da lista de ícones na área de notificação ou janelas de aplicativos iniciados,
* Ajuda na composição de um símbolo complexo como, por exemplo, um a e relacionado, um símbolo de potência de 2 e possibilidade de adicionar suas próprias categorias e símbolos,
* Extensão da funcionalidade do buffer virtual para navegador:
 * novos comandos para o modo de navegação (parágrafo, divisão, âncora, ponto de referência principal),
 * novos tipos de elementos para a caixa de diálogo aberta pelo "NVDA+F7" (botão de opção, parágrafo, quadro, caixa de seleção, etc) com o anúncio do número de itens encontrados,
 * opção de navegar em loop em busca de um item seguinte ou anterior,
 * novos scripts para tabela: anúncio de célula/linha/coluna, passar para a coluna/linha seguinte ou anterior com anúncio das células que a compõem,
* anúncio inteligente da função de comandos de edição como Copiar, Recortar ou Colar e melhoria do script base do NVDA que anuncia o texto na área de transferência ("NVDA+c"),
* histórico de falas de voz,
* renomeação de teclas do teclado,
* anúncio seletivo de teclas de comando,
* exibição dos elementos visíveis que compõem o objeto em primeiro plano e possibilidade de mover ou clicar nos elementos,
* troca rápida de perfil de voz,
* persistência do NVDA e das teclas modificadoras e persistência específica para o site gmail.com,
* desligar, reiniciar ou hibernar o computador,
* gerenciamento de gestos de entrada configurados pelo usuário,
* controle de som: alterações rápidas de volume do sistema/NVDA/aplicativo, divisão de áudio, troca temporária de dispositivo de saída de áudio,
* gerenciamento de configurações do usuário e reinicialização do NVDA com configuração precisa,
* analisador de texto,
* ativação/desativação rápida de complementos,
* anúncio ou exibição de informações sobre o aplicativo em foco, como sua versão, perfil de configuração ativo, complemento carregado,
* possível uso do teclado numérico como teclado numérico padrão,
* possibilidade de executar scripts a partir da caixa de diálogo "Inserir gestos",
* e muito mais.

Para ver a lista completa dos recursos do complemento e sua descrição, consulte o manual do usuário.
"""
